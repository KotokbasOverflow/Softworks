[package]
name = "snip"
version = "0.1.0"
edition = "2024"
description = "Shell snippet manager with a secret-redaction gate (SQLite, fuzzy search)"
authors = ["KotokbasOverflow"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KotokbasOverflow/Softworks"
keywords = ["snippets", "shell", "cli", "productivity"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
secdetect = { version = "0.1.0", path = "../Secdetect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
age = "0.12"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
