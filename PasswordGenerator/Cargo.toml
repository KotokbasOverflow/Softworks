[package]
name = "password-generator"
version = "0.2.0"
edition = "2024"
description = "Generate secure passwords and EFF Diceware passphrases (CSPRNG, clipboard support)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KotokbasOverflow/Softworks"
keywords = ["password", "passphrase", "security", "cli", "diceware"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
zeroize = "1"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 0
