[package]
name = "hist"
version = "0.1.0"
edition = "2024"
description = "Find and redact leaked secrets in shell history files (PowerShell, bash, zsh)"
authors = ["KotokbasOverflow"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KotokbasOverflow/Softworks"
keywords = ["history", "secrets", "security", "cli", "shell"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
secdetect = { version = "0.1.0", path = "../Secdetect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
age = "0.12"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
